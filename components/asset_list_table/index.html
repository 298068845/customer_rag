<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #303544;
      font-family: "Source Sans Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    .asset-table {
      width: 100%;
      height: 336px;
      border: 1px solid #e6e8ef;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      box-sizing: border-box;
    }

    .row {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      min-height: 44px;
      border-bottom: 1px solid #edf0f4;
      box-sizing: border-box;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .header {
      min-height: 44px;
      background: #f7f8fb;
      color: #8a94a6;
      font-weight: 400;
    }

    .cell {
      display: flex;
      align-items: center;
      min-width: 0;
      padding: 0 10px;
      border-right: 1px solid #edf0f4;
      box-sizing: border-box;
    }

    .cell:last-child {
      border-right: 0;
    }

    .delete-cell {
      justify-content: center;
      gap: 8px;
    }

    .delete-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .delete-label input {
      width: 16px;
      height: 16px;
      margin: 0;
      appearance: none;
      border: 2px solid #b7bdc7;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      box-sizing: border-box;
    }

    .delete-label input:checked {
      border-color: #e65f58;
      background: #e65f58;
      box-shadow: inset 0 0 0 3px #fff;
    }

    .title-cell {
      color: #303544;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-cell:hover {
      background: #f7f8fb;
    }

    .title-cell.selected {
      background: #f4f6fa;
      color: #303544;
      font-weight: 400;
    }

    .empty .cell {
      cursor: default;
      background: #fff;
    }

    .header-icon {
      color: #8a94a6;
      font-size: 14px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const Streamlit = {
      READY: "streamlit:componentReady",
      RENDER: "streamlit:render",
      SET_VALUE: "streamlit:setComponentValue",
      SET_FRAME_HEIGHT: "streamlit:setFrameHeight",
      setComponentReady() {
        window.parent.postMessage({ isStreamlitMessage: true, type: this.READY, apiVersion: 1 }, "*");
      },
      setFrameHeight(height) {
        window.parent.postMessage({ isStreamlitMessage: true, type: this.SET_FRAME_HEIGHT, height }, "*");
      },
      setComponentValue(value) {
        window.parent.postMessage({ isStreamlitMessage: true, type: this.SET_VALUE, value }, "*");
      },
    };

    let rows = [];
    let selectedId = "";
    let deleteIds = new Set();

    function emitValue() {
      Streamlit.setComponentValue({
        selected_id: selectedId,
        delete_ids: Array.from(deleteIds),
      });
    }

    function render() {
      const root = document.getElementById("root");
      const minRows = Math.max(rows.length, 8);
      const html = [];
      html.push("<div class='asset-table'>");
      html.push("<div class='row header'><div class='cell delete-cell'><span class='header-icon'>☰</span><span>删除</span></div><div class='cell'>素材名称</div></div>");

      rows.forEach((row) => {
        const checked = deleteIds.has(row.id) ? " checked" : "";
        const selected = row.id === selectedId ? " selected" : "";
        html.push(
          `<div class="row" data-id="${escapeAttr(row.id)}">` +
            `<div class="cell delete-cell"><label class="delete-label" title="删除"><input type="checkbox" data-delete="${escapeAttr(row.id)}"${checked}></label></div>` +
            `<div class="cell title-cell${selected}" data-select="${escapeAttr(row.id)}" title="${escapeAttr(row.title)}">${escapeHtml(row.title)}</div>` +
          `</div>`
        );
      });

      for (let index = rows.length; index < minRows; index += 1) {
        html.push("<div class='row empty'><div class='cell'></div><div class='cell'></div></div>");
      }
      html.push("</div>");
      root.innerHTML = html.join("");

      root.querySelectorAll("[data-select]").forEach((node) => {
        node.addEventListener("click", () => {
          selectedId = node.getAttribute("data-select") || "";
          render();
          emitValue();
        });
      });

      root.querySelectorAll("[data-delete]").forEach((node) => {
        node.addEventListener("change", () => {
          const id = node.getAttribute("data-delete") || "";
          if (node.checked) {
            deleteIds.add(id);
          } else {
            deleteIds.delete(id);
          }
          emitValue();
        });
      });

      Streamlit.setFrameHeight(336);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== Streamlit.RENDER) {
        return;
      }
      const args = event.data.args || {};
      rows = Array.isArray(args.rows) ? args.rows : [];
      selectedId = args.selected_id || "";
      deleteIds = new Set(Array.isArray(args.delete_ids) ? args.delete_ids : []);
      render();
    });

    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(336);
  </script>
</body>
</html>
